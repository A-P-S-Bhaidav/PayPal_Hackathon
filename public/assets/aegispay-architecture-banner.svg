<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" fill="none">
  <rect width="1200" height="280" fill="#050507"/>
  <rect x="24" y="24" width="1152" height="232" fill="#0A0C12" stroke="#1E2433" stroke-width="1.5"/>
  <!-- 4 Symmetrical Architectural Stages -->
  <g font-family="'JetBrains Mono', monospace">
    <!-- Stage 1 -->
    <rect x="52" y="56" width="250" height="168" fill="#050507" stroke="#0047FF" stroke-width="1.5"/>
    <rect x="52" y="56" width="250" height="4" fill="#0047FF"/>
    <text x="70" y="86" fill="#0047FF" font-size="11" font-weight="700">01 // AUTH &amp; RATE SHIELD</text>
    <text x="70" y="114" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Mandatory Zero-Trust Gate</text>
    <text x="70" y="138" fill="#94A3B8" font-size="11">Google OAuth 2.0 + scrypt</text>
    <text x="70" y="158" fill="#94A3B8" font-size="11">HMAC Session + Token Bucket</text>
    <text x="70" y="198" fill="#CCFF00" font-size="11" font-weight="700">TENANT-ISOLATED STORE</text>

    <!-- Arrow 1 -->
    <line x1="302" y1="140" x2="334" y2="140" stroke="#CCFF00" stroke-width="2"/>

    <!-- Stage 2 -->
    <rect x="334" y="56" width="250" height="168" fill="#050507" stroke="#1E2433" stroke-width="1.5"/>
    <rect x="334" y="56" width="250" height="4" fill="#CCFF00"/>
    <text x="352" y="86" fill="#CCFF00" font-size="11" font-weight="700">02 // AI + ML INFERENCE</text>
    <text x="352" y="114" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Signal &amp; SHAP Diagnosis</text>
    <text x="352" y="138" fill="#94A3B8" font-size="11">Gemini 3 -&gt; Groq LPU Failover</text>
    <text x="352" y="158" fill="#94A3B8" font-size="11">XGBoost + Exact TreeSHAP</text>
    <text x="352" y="198" fill="#0047FF" font-size="11" font-weight="700">CONTEXTUAL BANDIT EV</text>

    <!-- Arrow 2 -->
    <line x1="584" y1="140" x2="616" y2="140" stroke="#CCFF00" stroke-width="2"/>

    <!-- Stage 3 -->
    <rect x="616" y="56" width="250" height="168" fill="#050507" stroke="#0047FF" stroke-width="1.5"/>
    <rect x="616" y="56" width="250" height="4" fill="#0047FF"/>
    <text x="634" y="86" fill="#0047FF" font-size="11" font-weight="700">03 // COMPLIANCE KERNEL</text>
    <text x="634" y="114" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Deterministic Verdict</text>
    <text x="634" y="138" fill="#94A3B8" font-size="11">Monotonic ALLOW / HOLD / BLOCK</text>
    <text x="634" y="158" fill="#94A3B8" font-size="11">0 Compliance Refusal Breaches</text>
    <text x="634" y="198" fill="#CCFF00" font-size="11" font-weight="700">INTEGER-CENT INVARIANTS</text>

    <!-- Arrow 3 -->
    <line x1="866" y1="140" x2="898" y2="140" stroke="#CCFF00" stroke-width="2"/>

    <!-- Stage 4 -->
    <rect x="898" y="56" width="250" height="168" fill="#0047FF"/>
    <rect x="898" y="56" width="250" height="4" fill="#CCFF00"/>
    <text x="916" y="86" fill="#CCFF00" font-size="11" font-weight="700">04 // PAYPAL EXECUTION</text>
    <text x="916" y="114" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Live Sandbox Settlement</text>
    <text x="916" y="138" fill="#E2E8F0" font-size="11">Orders v2 + Partial Refunds</text>
    <text x="916" y="158" fill="#E2E8F0" font-size="11">Vault v3 + Invoicing v2</text>
    <text x="916" y="198" fill="#CCFF00" font-size="11" font-weight="700">SHA-256 AUDIT TRAIL</text>
  </g>
</svg>
